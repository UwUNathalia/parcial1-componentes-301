# Configuracion del proyecto para Gradle.
# Memoria asignada al daemon de Gradle.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Cache de configuracion: Gradle se salta la fase de configuracion si nada cambio.
org.gradle.configuration-cache=true

# Estilo de codigo oficial de Kotlin.
kotlin.code.style=official

# AndroidX (obligatorio para Jetpack Compose).
android.useAndroidX=true
